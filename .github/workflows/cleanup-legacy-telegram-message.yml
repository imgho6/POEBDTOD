name: One-time cleanup of retired Telegram interval post

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-legacy-telegram-message.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-legacy-message:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete retired interval message 302
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          payload = urllib.parse.urlencode({
              "chat_id": "-1004464555562",
              "message_id": "302",
          }).encode()
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/deleteMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)

          if not result.get("ok"):
              raise SystemExit(result.get("description", "Telegram deleteMessage failed"))
          if result.get("result") is not True:
              raise SystemExit("Telegram did not confirm deletion of message 302")
          print("Telegram confirmed deletion of legacy message 302.")
          PY
