name: Telegram workflow watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/telegram-watchdog.yml
      - scripts/telegram-watchdog.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: telegram-workflow-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check "psycopg[binary]"
      - name: Check publisher schedule
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/telegram-watchdog.py
