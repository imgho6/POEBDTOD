name: Unified monitoring

on:
  workflow_run:
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poltava-light-unified-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Unified monitoring'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore monitoring state
        uses: actions/cache/restore@v4
        with:
          path: .monitoring-state.json
          key: poltava-light-monitor-${{ github.run_id }}
          restore-keys: |
            poltava-light-monitor-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check website, schedule freshness and bot publications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONITORED_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          MONITORED_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          MONITORED_WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
        run: python scripts/monitoring.py

      - name: Save monitoring state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitoring-state.json
          key: poltava-light-monitor-${{ github.run_id }}
