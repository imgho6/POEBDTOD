name: Telegram – графіки та прогнози

on:
  # Автоматичний запуск за 15 хв до кожної півгодинної межі.
  # GitHub використовує UTC, але хвилини :15 та :45 не залежать від часового поясу Києва.
  schedule:
    - cron: "15,45 * * * *"
  # Запуск при зміні самого workflow потрібен для негайної перевірки конфігурації.
  push:
    branches:
      - main
    paths:
      - .github/workflows/telegram-publisher.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-publication-v3
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Завантажити репозиторій
        uses: actions/checkout@v4

      - name: Встановити Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Встановити Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Встановити залежності та перевірити Telegram-скрипти
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python -m py_compile scripts/telegram-schedules.py scripts/telegram-editorial.py scripts/test_telegram_schedules.py scripts/test_telegram_editorial.py
          python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Відновити попередні графіки та стан публікацій
        id: restore_cache
        shell: bash
        run: |
          mkdir -p public/data/schedules
          git fetch origin gh-pages --depth=1
          git ls-tree -r --name-only origin/gh-pages schedules/ | while read file; do
            mkdir -p "public/data/$(dirname "$file")"
            git show "origin/gh-pages:$file" > "public/data/$file"
          done
          rm -rf /tmp/poltava-schedules-cache
          cp -a public/data/schedules /tmp/poltava-schedules-cache

      - name: Отримати актуальні графіки з джерел
        id: refresh
        continue-on-error: true
        run: node scripts/update-schedules.mjs

      - name: Відновити кеш, якщо джерела тимчасово недоступні
        if: always() && steps.refresh.outcome != 'success' && steps.restore_cache.outcome == 'success'
        shell: bash
        run: |
          rm -rf public/data/schedules
          mkdir -p public/data/schedules
          cp -a /tmp/poltava-schedules-cache/. public/data/schedules/

      - name: Надіслати повідомлення про зміни графіків
        if: steps.refresh.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1004464555562"
        run: python scripts/telegram-schedules.py

      # Спочатку публікуємо зміни графіків, потім короткий прогноз.
      - name: Надіслати прогноз наступного півгодинного інтервалу
        if: always() && steps.restore_cache.outcome == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1004464555562"
          TELEGRAM_BOUNDARY_ADVANCE_SECONDS: "900"
        run: python scripts/telegram-schedules.py --status-only

      - name: Ранкові дописи, поради та новини (лише текст)
        if: always() && steps.restore_cache.outcome == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1004464555562"
        run: python scripts/telegram-editorial.py

      # Never clear the published cache after a failed refresh. If the refresh
      # succeeded, publish its validated files even if image capture failed.
      - name: Опублікувати JSON і стан Telegram
        if: always() && steps.restore_cache.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public/data/schedules
          destination_dir: schedules
          keep_files: false
