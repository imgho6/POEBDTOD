name: Telegram – графіки та прогнози

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_call:
  push:
    branches:
      - main
    paths:
      - .github/workflows/telegram-publisher.yml
      - scripts/telegram-schedules.py
      - scripts/telegram-editorial.py
      - scripts/telegram-monitor.py
      - scripts/bot_db.py
      - scripts/telegram-admin.py
      - scripts/update-schedules.mjs
      - scripts/test_telegram_editorial.py
      - scripts/test_telegram_schedules.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-publication-v4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Завантажити репозиторій
        uses: actions/checkout@v4

      - name: Встановити Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Встановити Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Встановити залежності та перевірити Telegram-скрипти
        run: |
          python -m pip install --disable-pip-version-check Pillow "psycopg[binary]"
          python -m py_compile scripts/telegram-schedules.py scripts/telegram-editorial.py scripts/telegram-monitor.py scripts/telegram-admin.py scripts/bot_db.py scripts/test_telegram_schedules.py scripts/test_telegram_editorial.py scripts/test_telegram_admin.py
          python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Відновити попередні графіки та стан публікацій
        id: restore_cache
        shell: bash
        run: |
          mkdir -p public/data/schedules
          git fetch origin gh-pages --depth=1
          git ls-tree -r --name-only origin/gh-pages schedules/ | while read file; do
            mkdir -p "public/data/$(dirname "$file")"
            git show "origin/gh-pages:$file" > "public/data/$file"
          done
          rm -rf /tmp/poltava-schedules-cache
          cp -a public/data/schedules /tmp/poltava-schedules-cache

      - name: Отримати актуальні дані для прогнозів
        id: refresh
        continue-on-error: true
        run: node scripts/update-schedules.mjs

      - name: Відновити кеш, якщо джерело даних тимчасово недоступне
        if: always() && steps.refresh.outcome != 'success' && steps.restore_cache.outcome == 'success'
        shell: bash
        run: |
          rm -rf public/data/schedules
          mkdir -p public/data/schedules
          cp -a /tmp/poltava-schedules-cache/. public/data/schedules/

      - name: Повідомити канал про оновлення графіка
        id: schedule_publish
        if: steps.restore_cache.outcome == 'success' && steps.refresh.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@PoltavaLight"
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if python scripts/telegram-admin.py --is-enabled schedules; then
            python scripts/telegram-schedules.py
          else
            echo "Модуль графіків вимкнено через адмінпанель"
          fi

      - name: Надіслати прогноз наступного півгодинного інтервалу
        if: always() && steps.restore_cache.outcome == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@PoltavaLight"
          TELEGRAM_BOUNDARY_ADVANCE_SECONDS: "900"
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/telegram-schedules.py --status-only

      - name: Ранкові дописи, поради та новини (лише текст)
        id: editorial
        if: always() && steps.restore_cache.outcome == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@PoltavaLight"
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if python scripts/telegram-admin.py --is-enabled news; then
            python scripts/telegram-editorial.py
          else
            echo "Редакційний модуль вимкнено через адмінпанель"
          fi

      - name: Єдиний моніторинг сайту, графіків і Telegram
        if: always() && steps.restore_cache.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003570758649"
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REFRESH_STATUS: ${{ steps.refresh.outcome }}
          SCHEDULE_PUBLISH_STATUS: ${{ steps.schedule_publish.outcome }}
          EDITORIAL_STATUS: ${{ steps.editorial.outcome }}
          SCHEDULE_PUBLISH_RESULT: ${{ steps.schedule_publish.outputs.result }}
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
        run: |
          if python scripts/telegram-admin.py --is-enabled monitor; then
            python scripts/telegram-monitor.py
          else
            echo "Моніторинг вимкнено через адмінпанель"
          fi

      # Публікуємо стан Telegram, навіть якщо джерело графіків тимчасово недоступне.
      - name: Опублікувати JSON і стан Telegram
        if: always() && steps.restore_cache.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public/data/schedules
          destination_dir: schedules
          keep_files: false
