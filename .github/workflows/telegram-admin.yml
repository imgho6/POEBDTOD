name: Telegram admin update
on:
  workflow_dispatch:
    inputs:
      telegram_update:
        description: Telegram webhook update JSON
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: telegram-admin-update
  cancel-in-progress: false
jobs:
  handle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check "psycopg[binary]"
      - name: Process authorized Telegram update
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_UPDATE_JSON: ${{ inputs.telegram_update }}
        run: python scripts/telegram-admin.py
